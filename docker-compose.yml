services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      TZ: Asia/Yekaterinburg
      HEALTH_ADDR: 127.0.0.1:8080
    volumes:
      - bot-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  bot-data:
